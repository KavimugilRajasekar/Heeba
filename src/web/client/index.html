<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heeba — Intelligence Engine</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header id="topbar">
      <div class="logo-area">
        <div id="logo">HEEBA</div>
        <span class="logo-badge">AI</span>
      </div>

      <div class="mode-indicator" title="Current mode">
        <span class="dot"></span>
        <span id="mode-label">AUTO</span>
      </div>

      <div id="model-selector">
        <label>Model</label>
        <select id="model-select">
          <option value="">Loading...</option>
        </select>
      </div>

      <div id="stats-bar">
        <div class="stat-chip">
          <span class="label">RAM</span>
          <span class="value" id="stat-ram">--</span>
        </div>
        <div class="stat-chip">
          <span class="label">Up</span>
          <span class="value" id="stat-uptime">--:--:--</span>
        </div>
        <div class="stat-chip highlight">
          <span class="label">Tokens</span>
          <span class="value" id="stat-tokens">0</span>
        </div>
        <div class="stat-chip">
          <span class="label">CPU</span>
          <span class="value" id="stat-cpu">--</span>
        </div>
      </div>
    </header>

    <!-- Main Area -->
    <div id="main">
      <!-- Sidebar -->
      <aside id="sidebar" class="glass-panel">
        <div class="sidebar-header">
          <span class="sidebar-title">Sessions</span>
          <div class="sidebar-actions">
            <button class="icon-btn primary" id="btn-new-session" title="New Session (Ctrl+N)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="session-tree"></div>
        <button id="toggle-sidebar" title="Toggle Sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
      </aside>

      <!-- Chat Area -->
      <section id="chat-area" class="glass-panel">
        <div id="conversation"></div>

        <!-- Input -->
        <div id="input-area">
          <div class="input-container">
            <textarea id="prompt-input" placeholder="Ask Heeba anything... (Ctrl+Enter to send)" rows="1"></textarea>
            <div class="input-actions">
              <button class="input-btn primary" id="btn-send" title="Send (Ctrl+Enter)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                  <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
              <button class="input-btn danger hidden" id="btn-cancel" title="Cancel" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                  <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="input-hints">
            <span><kbd>Ctrl+Enter</kbd> send</span>
            <span><kbd>↑↓←→</kbd> navigate</span>
            <span><kbd>Ctrl+K</kbd> commands</span>
            <span><kbd>Ctrl+N</kbd> new session</span>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
